<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Reapers Daily"/>
<title>Reapers Elite Daily</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:#080c14;color:#e8eaf0;font-family:'DM Sans','Segoe UI',sans-serif;min-height:100vh;padding-bottom:40px;}
  ::-webkit-scrollbar{display:none;}
  button{font-family:inherit;}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const { useState, useEffect } = React;

const START_DATE = new Date("2026-05-06");

function getDayIndex() {
  const today = new Date(); today.setHours(0,0,0,0);
  const start = new Date(START_DATE); start.setHours(0,0,0,0);
  return Math.floor((today - start) / 86400000);
}
function getDayOfWeek(i) {
  const d = new Date(START_DATE); d.setDate(d.getDate()+i); return d.getDay();
}
function formatDate(i) {
  const d = new Date(START_DATE); d.setDate(d.getDate()+i);
  return d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
}

const SKATE_DAYS = [1,2,3,4];

const WORKOUTS = {
  skate:{
    label:"🏒 On-Ice Session + Gym", time:"8:15 – 10:30 AM",
    detail:[
      {section:"Pre-Ice Activation (8:00 AM)",exercises:["Hip 90/90 Stretch — 2×45s each side","Glute Bridge — 2×15","Band Lateral Walk — 2×15 each way","Dynamic Hip Circles — 2×10 each leg"]},
      {section:"On-Ice Practice (8:15–9:30)",exercises:["Team/individual skate session — full intensity","Stay hydrated — 16–20oz water on bench"]},
      {section:"Post-Skate Gym (9:30–10:30)",exercises:["Trap Bar Deadlift — 4×5 (heavy, explosive)","Bulgarian Split Squat — 3×8 each leg","Cable Row — 3×10","Single-Leg Romanian Deadlift — 3×8 each","Copenhagen Plank — 3×20s each side","Dead Bug — 3×10 each side"]}
    ]
  },
  offIcePower:{
    label:"💪 Power & Explosiveness", time:"Anytime",
    detail:[
      {section:"Warm-Up (10 min)",exercises:["Jump Rope — 3 min","World's Greatest Stretch — 5 each side","Ankle Mobility Circles — 2×10 each"]},
      {section:"Power Block",exercises:["Box Jump — 4×5 (max height, reset each rep)","Goblet Squat — 3×8 (heavy, full depth)","Dumbbell Romanian Deadlift — 4×8","Lateral Bound — 3×6 each side (stick landing)","Med Ball Rotational Slam — 3×8 each side"]},
      {section:"Core (Hockey-Specific)",exercises:["Pallof Press — 3×12 each side","Ab Wheel Rollout — 3×8","Side Plank Hip Dip — 3×15 each"]}
    ]
  },
  offIceConditioning:{
    label:"🔥 Conditioning + Strength", time:"Anytime",
    detail:[
      {section:"Warm-Up (8 min)",exercises:["Hip Flexor Stretch — 2×40s each","Inchworm Walk — 2×8","Leg Swing — 2×10 each direction"]},
      {section:"Strength Circuit (3 rounds)",exercises:["Dumbbell Front Squat — 3×10","Single-Arm Dumbbell Row — 3×10 each","Push-Up with Shoulder Tap — 3×12","Reverse Lunge — 3×10 each leg","Farmer Carry — 3×40 yards"]},
      {section:"Conditioning Finisher",exercises:["Bike Intervals — 8 rounds: 20s all-out / 40s easy","OR Treadmill Sprints — 6×30s at 10+ mph"]}
    ]
  },
  activeRecovery:{
    label:"🧘 Active Recovery", time:"30–45 min",
    detail:[
      {section:"Mobility Flow",exercises:["Foam Roll — Quads, IT Band, Upper Back (60s each)","Pigeon Pose — 2×60s each side","Couch Stretch — 2×60s each side","Thoracic Rotation — 2×10 each side","Lacrosse Ball — Glutes/Hip Rotators (90s each)"]},
      {section:"Light Activity",exercises:["20 min easy walk or bike (Zone 1 — conversational pace)","No heavy lifting, no sprints"]}
    ]
  }
};

function buildTasksForDay(i) {
  const dow = getDayOfWeek(i);
  const isSkate = SKATE_DAYS.includes(dow);
  const tasks = [];
  tasks.push({id:"sleep",icon:"😴",label:"Sleep 8–9 hours",category:"Recovery"});
  tasks.push({id:"hydrate",icon:"💧",label:"Drink 20oz water on waking",category:"Nutrition"});
  tasks.push({id:"morning_stretch",icon:"🌅",label:"Morning mobility (10 min)",category:"Mobility"});
  if(isSkate){
    tasks.push({id:"preworkout_meal",icon:"🍳",label:"Pre-skate meal (2hrs before) — oats, eggs, banana",category:"Nutrition"});
    tasks.push({id:"skate",icon:"🏒",label:"On-Ice Session + Gym (8:15–10:30)",category:"Training",workout:"skate"});
    tasks.push({id:"post_workout",icon:"🥤",label:"Post-session shake within 30 min — protein + carbs",category:"Nutrition"});
  } else if(dow===5){
    tasks.push({id:"preworkout_meal",icon:"🍳",label:"Pre-workout meal — rice, chicken, fruit",category:"Nutrition"});
    tasks.push({id:"workout",icon:"💪",label:"Power & Explosiveness Training",category:"Training",workout:"offIcePower"});
    tasks.push({id:"post_workout",icon:"🥤",label:"Post-workout shake within 30 min",category:"Nutrition"});
  } else if(dow===6){
    tasks.push({id:"preworkout_meal",icon:"🍳",label:"Pre-workout meal — oats, eggs, coffee",category:"Nutrition"});
    tasks.push({id:"workout",icon:"🔥",label:"Conditioning + Strength",category:"Training",workout:"offIceConditioning"});
    tasks.push({id:"post_workout",icon:"🥤",label:"Post-workout shake within 30 min",category:"Nutrition"});
  } else if(dow===0){
    tasks.push({id:"workout",icon:"🧘",label:"Active Recovery Session",category:"Recovery",workout:"activeRecovery"});
  }
  tasks.push({id:"lunch",icon:"🍗",label:"Balanced lunch — lean protein, complex carbs, veggies",category:"Nutrition"});
  tasks.push({id:"creatine",icon:"💊",label:"Creatine 5g (with food)",category:"Nutrition"});
  tasks.push({id:"mental",icon:"🧠",label:"10 min visualization — game situations, reads, decisions",category:"Mental Game"});
  tasks.push({id:"film",icon:"🎥",label:"Watch 15 min of elite defensive play / film",category:"Mental Game"});
  tasks.push({id:"dinner",icon:"🥩",label:"High-protein dinner — steak/chicken, rice, veg",category:"Nutrition"});
  tasks.push({id:"stretch_night",icon:"🌙",label:"Evening stretch + breathwork (10 min)",category:"Recovery"});
  tasks.push({id:"screen",icon:"📵",label:"No screens 45 min before bed",category:"Recovery"});
  return tasks.map(t=>({...t,checked:false}));
}

const CAT_COLORS = {"Training":"#00d4ff","Recovery":"#a78bfa","Nutrition":"#34d399","Mental Game":"#fb923c","Mobility":"#f472b6"};

function App() {
  const [currentDay, setCurrentDay] = useState(getDayIndex());
  const [viewDay, setViewDay] = useState(getDayIndex());
  const [taskData, setTaskData] = useState({});
  const [workoutModal, setWorkoutModal] = useState(null);

  useEffect(()=>{
    const saved={};
    const cd=getDayIndex();
    for(let i=0;i<=cd;i++){
      try{const r=localStorage.getItem("hk_day_"+i);if(r)saved[i]=JSON.parse(r);}catch{}
    }
    setTaskData(saved);
  },[]);

  useEffect(()=>{
    const iv=setInterval(()=>{const nd=getDayIndex();if(nd!==currentDay){setCurrentDay(nd);}},60000);
    return()=>clearInterval(iv);
  },[currentDay]);

  function getTasks(d){return taskData[d]||buildTasksForDay(d);}

  function toggleTask(d,id){
    if(d>currentDay)return;
    const tasks=getTasks(d).map(t=>t.id===id?{...t,checked:!t.checked}:t);
    const updated={...taskData,[d]:tasks};
    setTaskData(updated);
    try{localStorage.setItem("hk_day_"+d,JSON.stringify(tasks));}catch{}
  }

  const tasks=getTasks(viewDay);
  const checked=tasks.filter(t=>t.checked).length;
  const progress=Math.round((checked/tasks.length)*100);
  const isLocked=viewDay>currentDay;
  const dayLabel=viewDay===currentDay?"Today":viewDay===currentDay-1?"Yesterday":"";

  const s=(obj)=>Object.entries(obj).map(([k,v])=>k.replace(/([A-Z])/g,'-$1').toLowerCase()+':'+v).join(';');

  return React.createElement('div',{style:{minHeight:'100vh',background:'#080c14',color:'#e8eaf0',paddingBottom:'40px'}},

    // Header
    React.createElement('div',{style:{background:'linear-gradient(135deg,#0d1b2e,#0a1628)',borderBottom:'1px solid #1a2a40',padding:'20px 20px 16px',position:'sticky',top:0,zIndex:10}},
      React.createElement('div',{style:{display:'flex',alignItems:'center',gap:'10px'}},
        React.createElement('span',{style:{fontSize:'22px'}},'🏒'),
        React.createElement('div',null,
          React.createElement('div',{style:{fontSize:'18px',fontWeight:700,color:'#fff'}},'Reapers Elite Daily'),
          React.createElement('div',{style:{fontSize:'11px',color:'#4a7fa5',letterSpacing:'1px',textTransform:'uppercase'}},'#28 · Defenseman')
        )
      )
    ),

    // Day scroller
    React.createElement('div',{style:{overflowX:'auto',padding:'14px 16px 0',display:'flex',gap:'8px'}},
      ...Array.from({length:currentDay+1}).map((_,i)=>{
        const d=new Date(START_DATE);d.setDate(d.getDate()+i);
        const dow=d.toLocaleDateString("en-US",{weekday:"short"});
        const date=d.getDate();
        const isView=i===viewDay;
        const isToday=i===currentDay;
        const dt=taskData[i]||[];
        const done=dt.filter(t=>t.checked).length;
        const total=dt.length||buildTasksForDay(i).length;
        const pct=Math.round((done/total)*100);
        return React.createElement('button',{key:i,onClick:()=>setViewDay(i),style:{minWidth:'52px',padding:'10px 6px',borderRadius:'12px',border:isView?'1.5px solid #00d4ff':'1.5px solid #1a2a40',background:isView?'rgba(0,212,255,0.08)':isToday?'rgba(255,255,255,0.04)':'transparent',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:'4px'}},
          React.createElement('span',{style:{fontSize:'10px',color:isView?'#00d4ff':'#4a7fa5',fontWeight:600}},dow),
          React.createElement('span',{style:{fontSize:'16px',fontWeight:700,color:isView?'#fff':'#8aa0b8'}},date),
          pct>0&&React.createElement('div',{style:{width:'28px',height:'3px',borderRadius:'2px',background:'#1a2a40',overflow:'hidden'}},
            React.createElement('div',{style:{width:pct+'%',height:'100%',background:pct===100?'#34d399':'#00d4ff'}})
          )
        );
      })
    ),

    // Day header
    React.createElement('div',{style:{padding:'18px 20px 10px'}},
      React.createElement('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-end'}},
        React.createElement('div',null,
          dayLabel&&React.createElement('div',{style:{fontSize:'11px',color:'#00d4ff',fontWeight:700,letterSpacing:'1.5px',textTransform:'uppercase',marginBottom:'2px'}},dayLabel),
          React.createElement('div',{style:{fontSize:'20px',fontWeight:700,color:'#fff'}},formatDate(viewDay))
        ),
        !isLocked&&React.createElement('div',{style:{textAlign:'right'}},
          React.createElement('div',{style:{fontSize:'22px',fontWeight:800,color:progress===100?'#34d399':'#00d4ff'}},progress+'%'),
          React.createElement('div',{style:{fontSize:'11px',color:'#4a7fa5'}},checked+'/'+tasks.length+' done')
        )
      ),
      !isLocked&&React.createElement('div',{style:{marginTop:'12px',height:'4px',borderRadius:'4px',background:'#1a2a40',overflow:'hidden'}},
        React.createElement('div',{style:{width:progress+'%',height:'100%',background:progress===100?'linear-gradient(90deg,#34d399,#059669)':'linear-gradient(90deg,#00d4ff,#0284c7)',transition:'width 0.4s ease',borderRadius:'4px'}})
      )
    ),

    // Content
    isLocked
      ? React.createElement('div',{style:{textAlign:'center',padding:'60px 20px',color:'#4a7fa5'}},
          React.createElement('div',{style:{fontSize:'48px',marginBottom:'12px'}},'🔒'),
          React.createElement('div',{style:{fontSize:'16px',fontWeight:600}},'Not unlocked yet'),
          React.createElement('div',{style:{fontSize:'13px',marginTop:'6px'}},'Check back on '+formatDate(viewDay))
        )
      : React.createElement('div',{style:{padding:'4px 16px'}},
          ...[...new Set(tasks.map(t=>t.category))].map(cat=>{
            const catTasks=tasks.filter(t=>t.category===cat);
            const color=CAT_COLORS[cat]||'#8aa0b8';
            return React.createElement('div',{key:cat,style:{marginBottom:'18px'}},
              React.createElement('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'8px'}},
                React.createElement('div',{style:{width:'3px',height:'14px',borderRadius:'2px',background:color}}),
                React.createElement('span',{style:{fontSize:'11px',fontWeight:700,letterSpacing:'1.2px',textTransform:'uppercase',color}},cat)
              ),
              React.createElement('div',{style:{display:'flex',flexDirection:'column',gap:'6px'}},
                ...catTasks.map(task=>
                  React.createElement('div',{key:task.id,onClick:()=>task.workout?setWorkoutModal(task.workout):toggleTask(viewDay,task.id),style:{display:'flex',alignItems:'center',gap:'12px',background:task.checked?'rgba(255,255,255,0.03)':'rgba(255,255,255,0.04)',borderRadius:'12px',padding:'12px 14px',border:task.checked?'1px solid rgba(255,255,255,0.05)':'1px solid rgba(255,255,255,0.07)',cursor:'pointer'}},
                    !task.workout&&React.createElement('div',{style:{width:'22px',height:'22px',borderRadius:'6px',flexShrink:0,border:task.checked?'none':'2px solid '+color+'44',background:task.checked?color:'transparent',display:'flex',alignItems:'center',justifyContent:'center'}},
                      task.checked&&React.createElement('span',{style:{fontSize:'12px',color:'#080c14'}},'✓')
                    ),
                    React.createElement('span',{style:{fontSize:'16px'}},task.icon),
                    React.createElement('div',{style:{flex:1}},
                      React.createElement('div',{style:{fontSize:'14px',fontWeight:500,color:task.checked?'#4a7fa5':'#e8eaf0',textDecoration:task.checked?'line-through':'none'}},task.label),
                      task.workout&&WORKOUTS[task.workout]?.time&&React.createElement('div',{style:{fontSize:'11px',color,marginTop:'2px'}},WORKOUTS[task.workout].time)
                    ),
                    task.workout&&React.createElement('div',{style:{fontSize:'11px',color,fontWeight:700,background:color+'18',padding:'4px 8px',borderRadius:'6px',flexShrink:0}},'VIEW →')
                  )
                )
              )
            );
          }),
          progress===100&&React.createElement('div',{style:{background:'linear-gradient(135deg,rgba(52,211,153,0.12),rgba(5,150,105,0.08))',border:'1px solid rgba(52,211,153,0.3)',borderRadius:'14px',padding:'18px',textAlign:'center',marginTop:'8px'}},
            React.createElement('div',{style:{fontSize:'28px',marginBottom:'6px'}},'🏆'),
            React.createElement('div',{style:{fontSize:'15px',fontWeight:700,color:'#34d399'}},'Day Complete'),
            React.createElement('div',{style:{fontSize:'12px',color:'#6b9e83',marginTop:'4px'}},"Elite athletes do what others won't. Keep stacking days.")
          )
        ),

    // Workout Modal
    workoutModal&&React.createElement('div',{onClick:()=>setWorkoutModal(null),style:{position:'fixed',inset:0,background:'rgba(0,0,0,0.85)',zIndex:100,display:'flex',alignItems:'flex-end',justifyContent:'center'}},
      React.createElement('div',{onClick:e=>e.stopPropagation(),style:{background:'#0d1b2e',borderRadius:'20px 20px 0 0',border:'1px solid #1a2a40',width:'100%',maxWidth:'480px',maxHeight:'85vh',overflowY:'auto',padding:'24px 20px 40px'}},
        React.createElement('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'18px'}},
          React.createElement('div',null,
            React.createElement('div',{style:{fontSize:'18px',fontWeight:700,color:'#fff'}},WORKOUTS[workoutModal].label),
            React.createElement('div',{style:{fontSize:'12px',color:'#00d4ff',marginTop:'2px'}},WORKOUTS[workoutModal].time)
          ),
          React.createElement('button',{onClick:()=>setWorkoutModal(null),style:{background:'rgba(255,255,255,0.08)',border:'none',borderRadius:'8px',color:'#8aa0b8',cursor:'pointer',padding:'6px 12px',fontSize:'14px'}},'✕')
        ),
        ...WORKOUTS[workoutModal].detail.map((sec,si)=>
          React.createElement('div',{key:si,style:{marginBottom:'20px'}},
            React.createElement('div',{style:{fontSize:'11px',fontWeight:700,letterSpacing:'1.2px',textTransform:'uppercase',color:'#00d4ff',marginBottom:'10px',display:'flex',alignItems:'center',gap:'8px'}},
              React.createElement('div',{style:{flex:1,height:'1px',background:'#1a2a40'}}),
              sec.section,
              React.createElement('div',{style:{flex:1,height:'1px',background:'#1a2a40'}})
            ),
            ...sec.exercises.map((ex,ei)=>
              React.createElement('div',{key:ei,style:{display:'flex',alignItems:'flex-start',gap:'10px',padding:'10px 0',borderBottom:ei<sec.exercises.length-1?'1px solid #1a2a40':'none'}},
                React.createElement('div',{style:{width:'22px',height:'22px',borderRadius:'50%',background:'rgba(0,212,255,0.1)',border:'1px solid rgba(0,212,255,0.2)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:'10px',color:'#00d4ff',fontWeight:700}},ei+1),
                React.createElement('span',{style:{fontSize:'14px',color:'#c8d4e0',lineHeight:1.5}},ex)
              )
            )
          )
        ),
        React.createElement('button',{onClick:()=>{toggleTask(viewDay,workoutModal==='skate'?'skate':'workout');setWorkoutModal(null);},style:{width:'100%',padding:'14px',background:'linear-gradient(90deg,#00d4ff,#0284c7)',border:'none',borderRadius:'12px',color:'#fff',fontWeight:700,fontSize:'15px',cursor:'pointer',marginTop:'8px'}},'Mark as Complete ✓')
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(React.createElement(App));
</script>
</body>
</html>
